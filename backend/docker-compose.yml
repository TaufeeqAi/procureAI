services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elecon
      POSTGRES_PASSWORD: elecon
      POSTGRES_DB: elecon_procurement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elecon -d elecon_procurement"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://elecon:elecon@postgres:5432/elecon_procurement
      CORS_ORIGINS_RAW: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m seed.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
