[project]
name = "elecon-procurement-api"
version = "0.1.0"
description = "Elecon Procurement Intelligence & Orchestration Platform — FastAPI + PostgreSQL backend."
requires-python = ">=3.12"
readme = "README.md"


dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52,<2.1.0",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.19.1",
    "python-multipart>=0.0.20",
    "langchain==1.4.0",
    "langchain-groq==1.1.3",
    "langgraph==1.2.11",
    "langchain-google-genai==4.4.0",
    "langgraph-checkpoint-postgres==3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Seed data literals (evidence text, AI-authored reason sentences) read
# worse artificially wrapped than left on one line — this is data, not
# logic, and the 120-char rule exists for the latter.
"seed/seed.py" = ["E501"]
